<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Gestão de clientes</title><desc id="desc">Painel ilustrativo de gestão de clientes sem dados fictícios.</desc><rect width="1200" height="300" rx="28" fill="#071a31"/><g font-family="Arial" fill="#fff"><text x="55" y="62" font-size="28" font-weight="800">Clientes organizados</text><text x="55" y="91" font-size="15" fill="#a9cfff">Centralize contatos e acompanhe os projetos vinculados.</text></g><g fill="#fff"><rect x="55" y="130" width="320" height="105" rx="18"/><rect x="400" y="130" width="320" height="105" rx="18"/><rect x="745" y="130" width="400" height="105" rx="18"/></g><g font-family="Arial" fill="#0f172a"><text x="80" y="166" font-size="14">Clientes cadastrados</text><text x="80" y="208" font-size="28" font-weight="800">Seus dados</text><text x="425" y="166" font-size="14">Projetos vinculados</text><text x="425" y="208" font-size="28" font-weight="800">Seus projetos</text><text x="770" y="166" font-size="14">Organização</text><text x="770" y="208" font-size="24" font-weight="800" fill="#0b74ed">Tudo em um só lugar</text></g></svg>