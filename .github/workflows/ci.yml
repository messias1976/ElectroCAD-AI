name: CI/CD

on:
  push:
    branches: [ main, sprint-1 ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: electrocad
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/electrocad?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/electrocad?schema=public
      JWT_SECRET: ci-only-secret
      AI_ENCRYPTION_KEY: ci-only-ai-secret
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm --filter api exec prisma validate
      - name: Generate Prisma client
        run: pnpm --filter api run prisma:generate
      - name: Run API tests
        run: pnpm --filter api run test -- --runInBand
      - name: Build API
        run: pnpm --filter api run build
      - name: Build Web
        run: pnpm --filter web run build

  docker-build:
    name: Validate Docker images
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build -t electrocad-ai-api:ci -f apps/api/Dockerfile .
      - name: Build Web image
        run: docker build -t electrocad-ai-web:ci -f apps/web/Dockerfile .

  deploy-render:
    name: Deploy Render after validation
    runs-on: ubuntu-latest
    needs: [validate, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.RENDER_DEPLOY_HOOK_URL != ''
    steps:
      - name: Trigger Render deploy hook
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
