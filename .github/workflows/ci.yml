name: CI

on:
  push:
    branches: [ main, sprint-1 ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: electrocad
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter api run prisma:generate
        working-directory: ./apps/api
      - name: Run API tests
        run: pnpm --filter api run test
      - name: Build web
        run: pnpm --filter web run build

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build API image
        run: |
          docker build -t electrocad-ai-api:latest ./apps/api
          docker build -t electrocad-ai-web:latest ./apps/web
      # To push images to registry, configure secrets and uncomment the steps below.
      # - name: Login to registry
      #   uses: docker/login-action@v2
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      # - name: Push images
      #   run: |
      #     docker tag electrocad-ai-api:latest ghcr.io/${{ github.repository }}/electrocad-ai-api:latest
      #     docker push ghcr.io/${{ github.repository }}/electrocad-ai-api:latest
